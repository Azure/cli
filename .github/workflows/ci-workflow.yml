name: ci-workflow
on:
  push:
  workflow_dispatch:
 
jobs:
  test_action_job:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.x"

      - run: npm install --production

      - run: npm i -g ts-node
      - run: npm install typescript

      - name: Azure CLI Version test
        env:
          INPUT_AZCLIVERSION: 2.0.72
          INPUT_INLINESCRIPT: |
            az account show
            az storage -h
          EXPECTED_TO: pass
        run: ts-node test/main.test.ts
      
      - name: Azure CLI Version Test - Negative
        env:
          INPUT_AZCLIVERSION: 0
          INPUT_INLINESCRIPT: |
            az account show
            az storage -h
          EXPECTED_TO: fail
        run: ts-node test/main.test.ts
        
      - name: Inline Script Test - Negative
        env:
          INPUT_AZCLIVERSION: 2.0.72
          INPUT_INLINESCRIPT: " "
          EXPECTED_TO: fail
        run: ts-node test/main.test.ts
